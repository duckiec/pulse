name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: bash scripts/ci/build-matrix.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: bash scripts/ci/tidy-check.sh
      - run: bash scripts/ci/banned-import-audit.sh

  doc-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: bash scripts/ci/doc-sync-gate.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools python3
      - run: bash scripts/ci/test-gates.sh

  race:
    # The race detector instruments the test binary via cgo. The shipped
    # binary remains CGO-free; build-matrix proves it on every target.
    # Recorded in MEMORY.md ADL-0010.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: CGO_ENABLED=1 go test -race ./...
