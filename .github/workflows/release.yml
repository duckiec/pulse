name: release

# Hand-rolled releases: pushing a v* tag builds the six CGO-free binaries
# with the tag stamped in and attaches them to a GitHub Release. The
# installers (install.sh/install.ps1) download these assets by name, so
# the asset naming in scripts/release/build.sh is a contract, not a detail.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: bash scripts/release/build.sh "${GITHUB_REF_NAME}"
      # Idempotent publication: `gh release create` fails when the tag's
      # release object already exists (e.g. a prior run registered it before
      # failing on assets), so a re-run must upload into the existing
      # release instead of crashing. --clobber lets rerun assets overwrite.
      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Uploading/updating assets..."
            gh release upload "${GITHUB_REF_NAME}" dist/pulse-* dist/checksums.txt --clobber
          else
            echo "Creating fresh release for ${GITHUB_REF_NAME}..."
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/pulse-* dist/checksums.txt
          fi
