<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pulse — offline, Git-native API workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#263349" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="56" y="56" width="340" height="56" rx="10" fill="#060A13" stroke="#1E293B" stroke-width="1.5"/>
    <text x="76" y="92" font-size="26" fill="#34D399">$</text>
    <text x="102" y="92" font-size="26" fill="#E2E8F0">pulse api.http</text>
    <rect x="350" y="70" width="13" height="28" fill="#34D399"/>
  </g>
  <polyline points="72,216 160,216 192,134 232,276 272,174 300,216 384,216" fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="72" cy="216" r="9" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="384" cy="216" r="9" fill="#34D399" filter="url(#glow)"/>
  <line x1="430" y1="60" x2="430" y2="272" stroke="#1E293B" stroke-width="2"/>
  <text x="462" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="92" font-weight="bold" letter-spacing="4" fill="#F8FAFC">pulse</text>
  <text x="464" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="29" letter-spacing="1" fill="#94A3B8">offline &#183; git-native &#183; dual-mode</text>
  <text x="464" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" letter-spacing="1" fill="#64748B">one engine &#183; TUI + MCP &#183; single binary</text>
</svg>
