<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Pulse — the anti-bloat, zero-trust API workbench for the terminal</title>
  <desc id="desc">Wordmark with a pulse waveform, above the lines: offline, git-native, dual-mode; one CGO-free binary, .http files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#263349" stroke-width="2"/>
  <rect x="48" y="46" width="88" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="150" font-size="88" font-weight="700" letter-spacing="-2" fill="#F8FAFC">pulse</text>
    <text x="52" y="196" font-size="24" letter-spacing="0.5" fill="#94A3B8">the anti-bloat, zero-trust API workbench</text>
    <text x="52" y="230" font-size="19" letter-spacing="0.5" fill="#64748B">for the terminal</text>

    <g font-size="17" fill="#7C8AA5">
      <text x="700" y="104">.http files, not .bru</text>
      <text x="700" y="136">one CGO-free Go binary</text>
      <text x="700" y="168">TUI for humans, MCP for agents</text>
      <text x="700" y="200">no account, no telemetry</text>
    </g>
    <g fill="#34D399" font-size="17">
      <text x="672" y="104">›</text>
      <text x="672" y="136">›</text>
      <text x="672" y="168">›</text>
      <text x="672" y="200">›</text>
    </g>
  </g>

  <polyline points="52,266 120,266 148,236 176,282 204,248 232,266 300,266" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="52" cy="266" r="4.5" fill="#22D3EE"/>
  <circle cx="300" cy="266" r="4.5" fill="#34D399"/>
</svg>
