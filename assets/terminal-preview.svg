<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="Pulse terminal session: init, vault seal, doctor, test">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16203200"/>
      <stop offset="0" stop-color="#141C2E"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
  </defs>
  <rect width="860" height="560" rx="16" fill="#0B0F19"/>
  <rect x="1" y="1" width="858" height="558" rx="15" fill="none" stroke="#263349" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="54" rx="15" fill="url(#chrome)"/>
  <rect x="1" y="38" width="858" height="16" fill="#0F1626"/>
  <line x1="1" y1="54" x2="859" y2="54" stroke="#263349" stroke-width="1"/>
  <circle cx="36" cy="28" r="8" fill="#F87171"/>
  <circle cx="62" cy="28" r="8" fill="#FBBF24"/>
  <circle cx="88" cy="28" r="8" fill="#34D399"/>
  <text x="120" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7C8AA5">pulse — quickstart</text>
  <text x="788" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">80 × 24</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="32" y="96" fill="#34D399">$</text>
    <text x="52" y="96" fill="#E2E8F0">pulse init</text>
    <text x="32" y="122" fill="#64748B">wrote quickstart.http (refused to overwrite without --force)</text>
    <text x="32" y="154" fill="#34D399">$</text>
    <text x="52" y="154" fill="#E2E8F0">pulse vault set DEMO_TOKEN</text>
    <text x="32" y="180" fill="#64748B">sealed DEMO_TOKEN (value hidden, names-only in list)</text>
    <text x="32" y="212" fill="#34D399">$</text>
    <text x="52" y="212" fill="#E2E8F0">pulse doctor</text>
    <text x="32" y="238" fill="#34D399">ok:</text>
    <text x="68" y="238" fill="#64748B">keyring reachable · vault sound · 2 files, 0 errors</text>
    <text x="32" y="270" fill="#34D399">$</text>
    <text x="52" y="270" fill="#E2E8F0">pulse test . --format tap</text>
    <rect x="28" y="286" width="804" height="112" rx="8" fill="#060A13" stroke="#1E293B" stroke-width="1"/>
    <text x="44" y="312" fill="#E2E8F0">TAP version 13</text>
    <text x="44" y="338" fill="#34D399">ok</text>
    <text x="72" y="338" fill="#E2E8F0">1 — GET /health</text>
    <text x="44" y="364" fill="#34D399">ok</text>
    <text x="72" y="364" fill="#E2E8F0">2 — POST /notes</text>
    <text x="44" y="390" fill="#64748B">1..2</text>
    <text x="32" y="424" fill="#64748B"># @assert status == 200 passed; body tail streamed in 32 KiB chunks</text>
    <text x="32" y="456" fill="#34D399">$</text>
    <text x="52" y="456" fill="#E2E8F0">pulse api.http</text>
    <rect x="52" y="444" width="11" height="20" fill="#34D399" opacity="0.85"/>
    <text x="32" y="484" fill="#64748B">TUI: tree · request · stream — j/k scroll, ^S send, ? help</text>
  </g>
  <rect x="1" y="505" width="858" height="54" fill="#0F1626"/>
  <rect x="1" y="505" width="858" height="54" rx="0" fill="none" stroke="#263349" stroke-width="1"/>
  <line x1="1" y1="505" x2="859" y2="505" stroke="#263349" stroke-width="1"/>
  <text x="32" y="531" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">illustrative layout; commands and grammar are verbatim from QUICKSTART.md</text>
</svg>
